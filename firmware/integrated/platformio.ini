; Plant Autonomy Testbed — Phase 2 integrated firmware
; See DL-040 for architectural principles.

[env:wrover]
platform = espressif32
board = esp-wrover-kit
framework = arduino

monitor_speed = 115200
upload_speed = 460800

upload_port = /dev/cu.usbserial-1140
monitor_port = /dev/cu.usbserial-1140

build_flags =
    -DBOARD_HAS_PSRAM
    ; P1-8/DL-134: stamp the build with the short git SHA (with -dirty if uncommitted) so
    ; the running firmware can report exactly what it is. (No date — bare '%' breaks the
    ; PlatformIO config parser; the SHA is the identifier that matters.)
    !echo '-DFW_GIT_SHA=\\"'$(git rev-parse --short HEAD 2>/dev/null || echo unknown)$(git diff --quiet 2>/dev/null || echo -dirty)'\\"'

lib_ldf_mode = deep

lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.4
    claws/BH1750@^1.3.0
    adafruit/Adafruit GFX Library@^1.11.10
    adafruit/Adafruit SSD1306@^2.5.10
