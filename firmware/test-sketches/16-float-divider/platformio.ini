; Plant Autonomy Testbed — diagnostic: supervised float divider reader (P0-5)
;
; Reads the raw ADC value on GPIO35 (ADC1, input-only, WiFi-safe — GPIO32 is BTN_ABORT)
; once per second so the three supervised states of the float divider can be verified
; before firmware is written:
;   switch CLOSED (empty)  -> ~0      (switch shorts the node to GND)
;   switch OPEN   (water)  -> ~2048   (R1/R2 divider, ~1.65 V)
;   wire CUT      (fault)  -> ~4095   (only R1 pull-up remains, ~3.3 V)
;
; No pump, WiFi, MQTT, or watering — it only reads the pin.

[env:wrover]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1140
monitor_port = /dev/cu.usbserial-1140
