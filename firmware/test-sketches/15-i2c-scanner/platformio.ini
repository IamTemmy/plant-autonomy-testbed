; Plant Autonomy Testbed — diagnostic: I2C bus scanner (DL-132)
;
; Probes the shared I2C bus (SDA=21, SCL=22) and reports every responding
; address, calling out the two environmental sensors specifically:
;   BME280 at 0x76 (or 0x77)   — temperature / humidity / pressure
;   BH1750 at 0x23             — ambient light (lux)
;
; Purpose: distinguish "sensors are electrically alive but the running firmware
; wasn't reading them" from "genuine I2C hardware fault (wiring / dead sensor)".
; This sketch touches NOTHING else — no pump, no WiFi, no MQTT, no watering.

[env:wrover]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1140
monitor_port = /dev/cu.usbserial-1140
