name: tests

# Host-side unit tests (P2-13). Two jobs, both run on every push/PR to main:
#   * pytest          -- the hub Python/SQL logic (stdlib-only modules).
#   * firmware-logic  -- the pure watering decision logic (water_logic.h) compiled
#                        and run on the host with g++ (no Arduino). The on-device
#                        firmware is still validated by flash-test separately; this
#                        covers the pump-path DECISION math that used to have no
#                        automated coverage at all.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run host-tests
        run: pytest

  firmware-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile + run water_logic host tests
        run: |
          g++ -std=c++11 -Wall -Wextra \
            -Ifirmware/integrated/src \
            tests/firmware/test_water_logic.cpp -o /tmp/test_water_logic
          /tmp/test_water_logic

