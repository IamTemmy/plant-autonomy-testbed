name: tests

# Host-side unit tests for the hub logic (P2-13). Runs on every push and PR so
# regressions in the Python/SQL logic are caught automatically -- the firmware is
# validated on-device separately. The tested modules currently use only the Python
# standard library, so CI installs just pytest; when coverage grows to modules with
# third-party imports (streamlit, paho-mqtt, ...), add a requirements-dev.txt here.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run host-tests
        run: pytest
